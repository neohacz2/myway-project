[project]
name = "topic-digest"
version = "0.1.0"
description = "Automated YouTube channel ingestion + weekly artifact batch for NotebookLM"
requires-python = ">=3.12"
dependencies = [
    "notebooklm-py[browser]>=0.5.0",
    "feedparser>=6.0.11",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
